# Application Configuration
server.port=8080
spring.application.name=portfolio

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JPA & Hibernate Settings
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Endpoints (For DevOps monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Security Credentials (Can be overridden by environment variables in production)
spring.datasource.password=${DB_PASSWORD}
app.admin.username=${ADMIN_USERNAME:deepesh_admin}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}

# CORS Configuration (Comma-separated list of allowed frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://portfolio-eta-ashen.vercel.app}